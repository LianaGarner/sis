name: Keep Supabase Awake

on:
  schedule:
    - cron: '0 8 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the database
        run: |
          URL=$(grep -o "const PROD={url:'[^']*'" config.js | sed "s/.*url:'//;s/'$//")
          KEY=$(grep -o "const PROD={url:'[^']*',key:'[^']*'" config.js | sed "s/.*key:'//;s/'$//")
          curl --fail --silent --show-error "$URL/rest/v1/profiles?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
