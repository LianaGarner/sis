<script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=s=>document.querySelector(s),A=$('#app'),M=()=>$('#main');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cg=w=>`<colgroup>${w.map(x=>`<col style="width:${x}%">`).join('')}</colgroup>`;
const WD={'Field,Value':[30,70],'Category,Percent of Grade,Points,Max,Percent,Mark':[30,16,14,14,14,12],'Assignment,Category,Score,Max,Percent':[30,16,14,14,26],'Course,Subject Area,Credits,Result':[40,30,15,15],'Course,School Year,Term':[50,30,20]};
const tbl=(h,r)=>`<table>${WD[h.join()]?cg(WD[h.join()]):''}<tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table>`;
const FS={},FOLD_OPEN=false;
const fold=(k,t,b)=>`<details class=fd data-f="${esc(k)}" ${(FS[k]??FOLD_OPEN)?'open':''}><summary class=fs>${t}</summary>${b}</details>`;
const doneBy=(pre,L,y,r)=>[...new Set(L.map(y))].sort().reverse().map(yr=>{const g=L.filter(x=>y(x)===yr);return fold(pre+yr,`${esc(yr)} <small>· ${g.length} ${g.length==1?'class':'classes'}</small>`,r(g))}).join('')||'<p>None.</p>';
const cmp=(a,b)=>b.school_year.localeCompare(a.school_year)||a.term.localeCompare(b.term)||a.courses.name.localeCompare(b.courses.name);

let me;
sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY')recover();if(ev==='SIGNED_OUT')login()});

function login(msg=''){A.innerHTML=`<div class=card style="max-width:340px;margin:12vh auto"><h2>${esc(SCHOOL)}</h2><p class=err>${esc(msg)}</p><input id=em type=email placeholder=Email><input id=pw type=password placeholder=Password><button id=go>Sign in</button><p><a href=# id=fp>Forgot password?</a></p></div>`;

function recover(){A.innerHTML=`<div class=card style="max-width:340px;margin:12vh auto"><h2>New password</h2><input id=np type=password placeholder="New password (8+ characters)"><button id=sv>Save</button><p id=m class=err></p></div>`;

async function start(){const{data:{user}}=await sb.auth.getUser();const{data}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
if(!data)return A.innerHTML='<div class=card>No profile for this account. Ask the administrator.</div>';me=data;

const res=id=>sb.from('enrollment_results').select('*').eq('student_id',id).order('school_year').order('term');
const R={id:{t:'profiles',s:'id,full_name,role',f:r=>r.role==='student',l:r=>r.full_name},course_id:{t:'courses',s:'id,name',l:r=>r.name},teacher_id:{t:'profiles',s:'id,full_name,role',f:r=>r.role==='teacher',l:r=>r.full_name},student_id:{t:'profiles',s:'id,full_name,role',f:r=>r.role==='student',l:r=>r.full_name},class_id:{t:'classes',s:'id,school_year,term,courses(name)',l:r=>`${r.courses.name} ${r.school_year} ${r.term}`}};
const SEL={term:['Fall','Spring'],role:['student','teacher','admin'],grading:[['pass_fail','Pass/Fail'],['letter','Letter Grade']],status:[['in_progress','In Progress'],['complete','Complete']]},NUM=['credits','pass_pct','credits_required','grade_level'];
const T={Students:['profiles',['full_name','role','student_code','grade_level','email'],0],'Student Info':['student_private',['id','father_name','whatsapp','notes'],0],Courses:['courses',['name','subject','credits'],1],Classes:['classes',['course_id','school_year','term','grading','pass_pct','status'],1],Requirements:['requirements',['subject','credits_required'],1]};
const LBL={course_id:'Course',teacher_id:'Teacher',class_id:'Class',student_id:'Student',school_year:'School Year',pass_pct:'Pass Percentage',credits_required:'Credits Required',name:'Course Name',subject:'Subject Area',credits:'Credits',term:'Term',grading:'Grading Type',status:'Status'},lb=c=>LBL[c]||c,cap=s=>String(s||'').replace(/^./,x=>x.toUpperCase());
const REQ={classes:['course_id','school_year','term'],courses:['name','subject','credits'],enrollments:['class_id','student_id'],requirements:['subject','credits_required']},PH={school_year:'e.g. 2026-2027'};
async function crud(name){const[tb,cols,add]=T[name],opts={};
for(const c of tb==='classes'?cols.concat('teacher_id'):cols)if(R[c]){const{data}=await sb.from(R[c].t).select(R[c].s);opts[c]=(data||[]).filter(R[c].f||(()=>1)).map(r=>[r.id,R[c].l(r)])}
const{data:rows,error}=await sb.from(tb).select('*').order(tb==='classes'?'school_year':cols[0],{ascending:tb!=='classes'}),key=tb==='requirements'?'subject':'id';
if(opts.id&&rows)rows.sort((a,b)=>(opts.id.find(o=>o[0]===a.id)?.[1]||'').localeCompare(opts.id.find(o=>o[0]===b.id)?.[1]||''));
let CT=null,subs=[];
if(tb==='classes'){const[{data:l},{data:t}]=await Promise.all([sb.from('class_teachers').select('*'),sb.from('profiles').select('id,full_name').eq('role','teacher').order('full_name')]);CT={l:l||[],t:t||[]}}
if(tb==='courses'){const{data:q}=await sb.from('requirements').select('subject').order('subject');subs=(q||[]).map(x=>x.subject)}
const tcell=cid=>CT.l.filter(x=>x.class_id===cid).map(x=>`<span class=chip>${esc((CT.t.find(t=>t.id===x.teacher_id)||{}).full_name)} <button class="ed tx" data-cl=${cid} data-tc=${x.teacher_id}>✕</button></span>`).join(' ')+`<select class=ta data-cl=${cid}><option value="">+ Add teacher</option>${CT.t.filter(t=>!CT.l.some(x=>x.class_id===cid&&x.teacher_id===t.id)).map(t=>`<option value=${t.id}>${esc(t.full_name)}</option>`).join('')}</select>`;
const inp=(c,v,id)=>{const o=opts[c]||(SEL[c]&&SEL[c].map(x=>Array.isArray(x)?x:[x,x]));return o?`<select data-c=${c} data-id="${id}" ${c==='id'?'disabled':''}><option value="">—</option>${o.map(([k,l])=>`<option value="${esc(k)}" ${k==v?'selected':''}>${esc(l)}</option>`).join('')}</select>`:`<input data-c=${c} data-id="${id}" value="${esc(v)}" ${c==='subject'&&tb==='courses'?'list=subs':''} ${PH[c]?`placeholder="${PH[c]}"`:''} ${NUM.includes(c)?'type=number step=any':''}>`};
const tb2=L=>`<table>${cg([...cols.map(()=>(94-(CT?18:0))/cols.length),...(CT?[18]:[]),6])}<tr>${cols.map(c=>`<th>${lb(c)}</th>`).join('')}${CT?'<th>Teachers</th>':''}<th></th></tr>${L.map(r=>`<tr>${cols.map(c=>`<td>${c==='pass_pct'&&r.grading==='letter'?'—':inp(c,r[c],r[key])}</td>`).join('')}${CT?`<td>${tcell(r.id)}</td>`:''}<td>${add?`<button class=x data-k="${esc(r[key])}">✕</button>`:''}</td></tr>`).join('')}</table>`;
M().innerHTML=`<datalist id=subs>${subs.map(x=>`<option value="${esc(x)}">`).join('')}</datalist><h3>${name}</h3><p class=err>${error?esc(error.message):''}</p>${add?`<div class=card id=addrow>${(tb==='classes'?cols.concat('teacher_id'):cols).map(c=>`<label>${lb(c)}${inp(c,'','new')}</label>`).join('')}<button id=add>Add</button></div>`:'<p>Student accounts are created in Supabase (Authentication), then edited here.</p>'}${tb==='classes'?`<h3>In-Progress Classes</h3>${tb2((rows||[]).filter(r=>r.status!=='complete'))}<h3>Completed Classes</h3>${doneBy('cr-',(rows||[]).filter(r=>r.status==='complete'),r=>r.school_year,tb2)}`:tb2(rows||[])}`;
M().querySelectorAll('table [data-c]').forEach(i=>i.onchange=async()=>{const{error}=await sb.from(tb).update({[i.dataset.c]:i.value===''?null:i.value}).eq(key,i.dataset.id);if(error)alert(error.message);else if(['grading','status'].includes(i.dataset.c))crud(name)});
M().querySelectorAll('.ta').forEach(x=>x.onchange=async()=>{if(x.value&&await ok(sb.from('class_teachers').insert({class_id:x.dataset.cl,teacher_id:x.value})))crud(name)});
M().querySelectorAll('.tx').forEach(b=>b.onclick=async()=>{if(await ok(sb.from('class_teachers').delete().match({class_id:b.dataset.cl,teacher_id:b.dataset.tc})))crud(name)});
const gs=$('#addrow [data-c=grading]');if(gs)gs.onchange=()=>{$('#addrow [data-c=pass_pct]').closest('label').style.display=gs.value==='letter'?'none':''};
if(add)$('#add').onclick=async()=>{const o={};M().querySelectorAll('#addrow [data-c]').forEach(i=>{if(i.value!=='')o[i.dataset.c]=i.value});const miss=(REQ[tb]||[]).filter(k=>!o[k]);if(miss.length)return alert('Please fill in: '+miss.map(lb).join(', '));const tid=o.teacher_id;delete o.teacher_id;const{data:nr,error}=await sb.from(tb).insert(o).select().single();if(!error&&tid)await sb.from('class_teachers').insert({class_id:nr.id,teacher_id:tid});error?alert(error.message):crud(name)};
M().querySelectorAll('.x').forEach(b=>b.onclick=async()=>{if(confirm('Delete this row?')){const{error}=await sb.from(tb).delete().eq(key,b.dataset.k);error?alert(error.message):crud(name)}})}

async function myInfo(){const{data:p}=await sb.from('student_private').select('*').eq('id',me.id).maybeSingle();
M().innerHTML='<div class=card><h3>My information</h3><p>Please check this carefully and tell the administrator if anything is wrong.</p>'+tbl(['Field','Value'],[['Full name',me.full_name],['Student ID',me.student_code],['Grade level',me.grade_level],['Email',me.email],["Father's name",p?.father_name],['WhatsApp',p?.whatsapp],['Additional info',p?.notes]])+'</div>'}
let sub='student';
async function users(){const{data}=await sb.from('profiles').select('*').order('full_name');
M().innerHTML=`<h3>Users</h3>${[['admin','Admins'],['teacher','Teachers'],['student','Students']].map(([r,l])=>`<button class=sb data-r=${r} ${r===sub?'disabled':''}>${l}</button>`).join('')}<input id=sq placeholder="Search by name, email${sub==='student'?', or student ID':''}" style="margin-top:10px"><div id=ul></div>`;
const draw=()=>{const q=$('#sq').value.toLowerCase();const L=data.filter(p=>p.role===sub&&[p.full_name,p.email,sub==='student'?p.student_code:''].join(' ').toLowerCase().includes(q));
$('#ul').innerHTML=`<table style="${sub==='student'?'':'width:70%'}">${cg(sub==='student'?[30,40,15,15]:[42.86,57.14])}<tr><th>Name</th><th>Email</th>${sub==='student'?'<th>Student ID</th><th>Grade Level</th>':''}</tr>${L.map(p=>`<tr class=pr data-id=${p.id} style="cursor:pointer"><td><a href=#>${esc(p.full_name)}</a></td><td>${esc(p.email)}</td>${sub==='student'?`<td>${esc(p.student_code)}</td><td>${esc(p.grade_level)}</td>`:''}</tr>`).join('')}</table><p>${L.length} shown</p>`;
M().querySelectorAll('.pr').forEach(r=>r.onclick=e=>{e.preventDefault();profile(r.dataset.id)})};
M().querySelectorAll('.sb').forEach(b=>b.onclick=()=>{sub=b.dataset.r;users()});$('#sq').oninput=draw;draw()}
async function profile(id,edit=false){const[{data:p},{data:v},{data:an}]=await Promise.all([sb.from('profiles').select('*').eq('id',id).single(),sb.from('student_private').select('*').eq('id',id).maybeSingle(),sb.from('admin_notes').select('*').eq('id',id).maybeSingle()]);
const st=p.role==='student',all={...p,...v,admin_notes:an?.notes},F=[['full_name','Full name'],['email','Email']].concat(st?[['student_code','Student ID'],['grade_level','Grade level'],['father_name',"Father's name"],['whatsapp','WhatsApp'],['notes','Additional info'],['admin_notes','Admin Notes (Admins Only)']]:[]);
const body=edit?F.map(([k,l])=>k==='admin_notes'?`<label>${l}<textarea data-k=admin_notes rows=4 style="width:100%;box-sizing:border-box">${esc(all[k])}</textarea></label>`:`<label>${l}<input data-k=${k} value="${esc(all[k])}" ${k==='grade_level'?'type=number':''}></label>`).join('')+'<p><small>This email is the contact email shown here. A login email is changed in Supabase.</small></p><button id=sv>Save</button><button id=cn>Cancel</button>':tbl(['Field','Value'],F.map(([k,l])=>[l,all[k]]))+'<button id=ed>Edit</button>';
M().innerHTML=`<button id=bk>← Back to users</button><div class=card><h3>${esc(p.full_name)} (${cap(p.role)})</h3>${body}</div><div id=pa></div>`;
$('#bk').onclick=()=>users();
if(edit){$('#cn').onclick=()=>profile(id);$('#sv').onclick=async()=>{const a={},b={},c={};M().querySelectorAll('[data-k]').forEach(i=>{const k=i.dataset.k,x=i.value.trim()===''?null:i.value.trim();if(k==='admin_notes')c.notes=x;else(['father_name','whatsapp','notes'].includes(k)?b:a)[k]=x});if(!a.full_name)return alert('Name is required.');
const r1=await sb.from('profiles').update(a).eq('id',id);if(r1.error)return alert(r1.error.message);
if(st){const r2=await sb.from('student_private').upsert({id,...b});if(r2.error)return alert(r2.error.message);const r3=await sb.from('admin_notes').upsert({id,...c});if(r3.error)return alert(r3.error.message)}profile(id)}}else $('#ed').onclick=()=>profile(id,true);
if(st){$('#pa').innerHTML='<h3>Grades</h3><div id=a1></div><div id=a2></div><div id=a3></div>';myGrades(id,$('#a1'));transcript(p,$('#a2'));credits(id,$('#a3'))}
else if(p.role==='teacher'){const{data:c}=await sb.from('class_teachers').select('classes(school_year,term,status,courses(name))').eq('teacher_id',id);const L=(c||[]).map(x=>x.classes).filter(Boolean).sort((a,b)=>b.school_year.localeCompare(a.school_year)),H=['Course','School Year','Term'],W=x=>x.map(y=>[y.courses.name,y.school_year,y.term]);
$('#pa').innerHTML='<h3>In-Progress Classes</h3>'+tbl(H,W(L.filter(x=>x.status!=='complete')))+'<h3>Completed Classes</h3>'+doneBy('tp'+id,L.filter(x=>x.status==='complete'),x=>x.school_year,g=>tbl(H,W(g)))}}
const passed=r=>r.status==='complete'&&r.result&&!['Fail','F'].includes(r.result);
const LET=p=>p>=90?'A':p>=80?'B':p>=70?'C':p>=60?'D':'F';
const markOf=(p,cl)=>p==null?'':cl.grading==='letter'?LET(p):p>=cl.pass_pct?'Pass':'Fail';
const pc=x=>x==null?'':Number(x).toFixed(2)+'%';
const ok=async q=>{const{error}=await q;if(error)alert(error.message);return !error};
function show(t){M().innerHTML='Loading…';const f={Grades:()=>myGrades(me.id),'My Classes':classList,Gradebooks:classList,Transcript:()=>transcript(me),Credits:()=>credits(me.id),Users:users,'My Info':myInfo,'Grade Levels':gradeTools,Enrollments:enrollments};return(f[t]||(()=>crud(t)))()}
async function myGrades(id,el=M()){const{data:E}=await res(id);if(!E||!E.length){el.innerHTML='<p>No classes yet.</p>';return}
const cids=E.map(e=>e.class_id),[{data:cats},{data:as}]=await Promise.all([sb.from('categories').select('*').in('class_id',cids),sb.from('assignments').select('*').in('class_id',cids)]);
const{data:sc}=as?.length?await sb.from('scores').select('*').eq('student_id',id).in('assignment_id',as.map(a=>a.id)):{data:[]};
const S=Object.fromEntries((sc||[]).map(s=>[s.assignment_id,s.points]));
const card=e=>{const cs=(cats||[]).filter(c=>c.class_id===e.class_id),A=(as||[]).filter(a=>a.class_id===e.class_id),tw=cs.reduce((s,c)=>s+Number(c.weight),0);
const grp=cs.length?cs.map(c=>({n:c.name,w:tw?c.weight/tw*100:0,A:A.filter(a=>a.category_id===c.id)})):[{n:'All Assignments',w:100,A}];
const rows=grp.map(g=>{const g2=g.A.filter(a=>S[a.id]!==undefined),pt=g2.reduce((s,a)=>s+Number(S[a.id]),0),mx=g2.reduce((s,a)=>s+Number(a.points_possible),0),p=mx?pt/mx*100:null;return[g.n,pc(g.w),mx?pt.toFixed(2):'',mx||'',pc(p),markOf(p,e)]});
rows.push(['Total','','','',pc(e.pct),e.auto_result||'']);
const list=A.map(a=>{const c=cs.find(c=>c.id===a.category_id),s=S[a.id];return[a.title,c?c.name:'',s===undefined?'—':s,a.points_possible,s===undefined?'':pc(s/a.points_possible*100)]});
return`<div class=card><h3>${esc(e.course)} <small>${esc(e.school_year)} ${esc(e.term)}</small></h3>${e.status==='complete'?`<p><b>Final Result: ${esc(e.result||'')}</b></p>`:'<p><small>In progress. Marks shown are current.</small></p>'}${tbl(['Category','Percent of Grade','Points','Max','Percent','Mark'],rows)}<details><summary>Individual assignments</summary>${tbl(['Assignment','Category','Score','Max','Percent'],list)}</details></div>`};
const ip=E.filter(e=>e.status!=='complete'),yrs=[...new Set(E.filter(e=>e.status==='complete').map(e=>e.school_year))].sort().reverse();
el.innerHTML='<h2>In-Progress Classes</h2>'+(ip.map(card).join('')||'<p>None.</p>')+'<h2>Completed Classes</h2>'+doneBy('g'+id+'-',E.filter(e=>e.status==='complete'),e=>e.school_year,g=>g.map(card).join(''))}
async function transcript(p,el=M()){const{data}=await res(p.id);const done=(data||[]).filter(r=>r.status==='complete'&&r.result),g={};
let h=`<div class=card><h2>Official Transcript</h2><p><b>${esc(p.full_name)}</b> · Student ID ${esc(p.student_code)} · Grade level: ${esc(p.grade_level)}</p>`;
done.forEach(r=>(g[r.school_year+' '+r.term]??=[]).push(r));
for(const k in g)h+=`<h3>${esc(k)}</h3>`+tbl(['Course','Subject Area','Credits','Result'],g[k].map(r=>[r.course,r.subject,r.credits,r.result]));
el.innerHTML=h+`<p><b>Total credits earned: ${done.filter(passed).reduce((s,r)=>s+Number(r.credits),0)}</b></p></div><button onclick=print()>Print</button>`}
async function credits(id,el=M()){const[{data:r},{data:q}]=await Promise.all([res(id),sb.from('requirements').select('*').order('subject')]);const e={};let tr=0,te=0;
(r||[]).filter(passed).forEach(x=>e[x.subject]=(e[x.subject]||0)+Number(x.credits));
const rows=(q||[]).map(x=>{const g=e[x.subject]||0,n=Number(x.credits_required);tr+=n;te+=Math.min(g,n);return`<tr><td>${esc(x.subject)}</td><td>${g} / ${n}</td><td><progress max=${n} value=${Math.min(g,n)}></progress></td></tr>`}).join('');
el.innerHTML=`<h3>Graduation progress: ${te} of ${tr} required credits</h3><table>${cg([40,20,40])}${rows}</table>`}
async function classList(){const{data}=await sb.from('classes').select('id,school_year,term,status,courses(name)').order('school_year',{ascending:false});
const D=(data||[]).sort(cmp),L=x=>x.map(c=>`<p><a href=# data-c=${c.id}>${esc(c.courses.name)} — ${esc(c.school_year)} ${esc(c.term)}</a></p>`).join('')||'<p>None.</p>';
M().innerHTML='<h3>In-Progress Classes</h3>'+L(D.filter(c=>c.status!=='complete'))+'<h3>Completed Classes</h3>'+doneBy('cl-',D.filter(c=>c.status==='complete'),c=>c.school_year,L);
M().querySelectorAll('[data-c]').forEach(a=>a.onclick=e=>{e.preventDefault();gradebook(a.dataset.c)})}
async function enrollments(){const[{data:cl},{data:en},{data:pr}]=await Promise.all([sb.from('classes').select('id,school_year,term,status,courses(name)').order('school_year',{ascending:false}),sb.from('enrollments').select('id,class_id,student_id'),sb.from('profiles').select('id,full_name,role').order('full_name')]);
const st=(pr||[]).filter(p=>p.role==='student'),nm=Object.fromEntries((pr||[]).map(p=>[p.id,p.full_name])),C=(cl||[]).sort(cmp);
const grid=L=>{if(!L.length)return'<p>None.</p>';const R=L.map(c=>({c,s:(en||[]).filter(e=>e.class_id===c.id).sort((a,b)=>(nm[a.student_id]||'').localeCompare(nm[b.student_id]||''))})),n=Math.max(1,...R.map(r=>r.s.length));
return`<div class=es><table class=gt style="table-layout:fixed;width:${230+190*n}px"><colgroup><col style="width:230px">${'<col style="width:190px">'.repeat(n)}</colgroup><tr><th>Class</th><th colspan=${n}>Students</th></tr>${R.map(r=>`<tr><td><b>${esc(r.c.courses.name)}</b><br><small>${esc(r.c.school_year)} ${esc(r.c.term)} · ${r.s.length} ${r.s.length==1?'student':'students'}</small></td>${r.s.map(e=>`<td class=sn><div class=sc><a href=# class=pl data-p=${e.student_id}>${esc(nm[e.student_id])}</a><button class=ed data-x=${e.id}>✕</button></div></td>`).join('')||'<td class=sn><small>No students yet</small></td>'}${'<td></td>'.repeat(n-Math.max(r.s.length,1))}</tr>`).join('')}</table></div>`};
M().innerHTML=`<h3>Enrollments</h3><div class=card><label>Class<select id=ec><option value="">—</option>${C.map(c=>`<option value=${c.id}>${esc(c.courses.name)} ${esc(c.school_year)} ${esc(c.term)}${c.status==='complete'?' (complete)':''}</option>`).join('')}</select></label><label>Student<select id=es><option value="">—</option>${st.map(p=>`<option value=${p.id}>${esc(p.full_name)}</option>`).join('')}</select></label><button id=ea>Add</button></div><h3>In-Progress Classes</h3>${grid(C.filter(c=>c.status!=='complete'))}<h3>Completed Classes</h3>${doneBy('en-',C.filter(c=>c.status==='complete'),c=>c.school_year,grid)}`;
$('#ea').onclick=async()=>{if(!$('#ec').value||!$('#es').value)return alert('Please choose a class and a student.');if(await ok(sb.from('enrollments').insert({class_id:$('#ec').value,student_id:$('#es').value})))enrollments()};
M().querySelectorAll('.ed[data-x]').forEach(b=>b.onclick=async()=>{if(confirm('Remove this student from the class? Their scores in it will stay but no longer count.')&&await ok(sb.from('enrollments').delete().eq('id',b.dataset.x)))enrollments()});
M().querySelectorAll('.pl').forEach(a=>a.onclick=e=>{e.preventDefault();profile(a.dataset.p)})}
async function studentCard(id,cid){const{data:p,error}=await sb.from('profiles').select('full_name,email,student_code,grade_level').eq('id',id).maybeSingle();
M().innerHTML=`<button id=bk2>← Back to Gradebook</button><div class=card><h3>${esc(p?.full_name)}</h3>${error||!p?'<p class=err>Could not load this student.</p>':tbl(['Field','Value'],[['Student',p.full_name],['Email',p.email],['Student ID',p.student_code],['Grade Level',p.grade_level]])}</div>`;$('#bk2').onclick=()=>gradebook(cid)}
async function gradebook(cid,ui={}){const old=$('.gb'),keep=old?[old.scrollTop,old.scrollLeft]:null;
const[{data:as},{data:en},{data:cl},{data:cats}]=await Promise.all([sb.from('assignments').select('*').eq('class_id',cid).order('created_at'),sb.from('enrollment_results').select('*').eq('class_id',cid),sb.from('classes').select('pass_pct,grading,status,courses(name)').eq('id',cid).single(),sb.from('categories').select('*').eq('class_id',cid).order('name')]);
const ids=en.map(e=>e.student_id),{data:pr}=await sb.from('profiles').select('id,full_name,student_code').in('id',ids.length?ids:['00000000-0000-0000-0000-000000000000']);
const{data:sc}=as.length?await sb.from('scores').select('*').in('assignment_id',as.map(a=>a.id)):{data:[]};
const nm=Object.fromEntries(pr.map(p=>[p.id,p])),S={};sc.forEach(s=>S[s.assignment_id+s.student_id]=s.points);
en.sort((a,b)=>(nm[a.student_id]?.full_name||'').localeCompare(nm[b.student_id]?.full_name||''));
const catPct=(sid,cid)=>{const g=as.filter(a=>a.category_id===cid&&S[a.id+sid]!==undefined),mx=g.reduce((t,a)=>t+Number(a.points_possible),0);return mx?g.reduce((t,a)=>t+Number(S[a.id+sid]),0)/mx*100:null};
const lt=cl.grading==='letter',done=cl.status==='complete',opts=lt?['','A','B','C','D','F']:['','Pass','Fail'],cn=id=>(cats.find(c=>c.id===id)||{}).name||'',tw=cats.reduce((s,c)=>s+Number(c.weight),0);
const catSel=v=>`<select id=fc><option value="">None</option>${cats.map(c=>`<option value=${c.id} ${c.id===v?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`;
const ea=as.find(a=>a.id===ui.id),ec=cats.find(c=>c.id===ui.id);
const panel=ui.p==='a'?`<div class=card><b>New assignment</b><label>Title<input id=ft></label><label>Category${catSel(cats[0]?.id||'')}</label><label>Points possible<input id=fp type=number step=any></label><button id=fs>Add</button><button id=fx>Cancel</button></div>`
:ui.p==='ea'&&ea?`<div class=card><b>Edit assignment</b><label>Title<input id=ft value="${esc(ea.title)}"></label><label>Category${catSel(ea.category_id)}</label><label>Points possible<input id=fp type=number step=any value="${ea.points_possible}"></label><button id=fs>Save</button><button id=fd>Delete assignment</button><button id=fx>Cancel</button></div>`
:ui.p==='c'?`<div class=card><b>New category</b><label>Name<input id=fn></label><label>Weight (percent of grade)<input id=fw type=number step=any></label><button id=cs>Add</button><button id=fx>Cancel</button></div>`
:ui.p==='ec'&&ec?`<div class=card><b>Edit category</b><label>Name<input id=fn value="${esc(ec.name)}"></label><label>Weight (percent of grade)<input id=fw type=number step=any value="${ec.weight}"></label><button id=cs>Save</button><button id=cd>Delete category</button><button id=fx>Cancel</button></div>`:'';
M().innerHTML=`<button id=back>← Back</button> <h3 style="display:inline">${esc(cl.courses.name)}</h3> <small>${done?'Graded (complete)':'In progress'}</small><p><button id=na>+ Assignment</button><button id=nc>+ Category</button><button id=st>${done?'Reopen class':'Mark class as complete and close gradebook'}</button></p><p><small>${lt?'Letter grades: 90+ A, 80+ B, 70+ C, 60+ D, below 60 F.':`Pass at ${cl.pass_pct}%.`} Blank = not yet graded. ${cats.length?"Assignments without a category don't count.":''}</small></p><p>${cats.length?'Categories: '+cats.map(c=>`${esc(c.name)} ${c.weight}% <button class="ed ec" data-k=${c.id}>✎</button>`).join(' · ')+(tw!==100?` <small>(weights total ${tw}%, rescaled automatically)</small>`:''):'<small>No categories: all assignments count by points.</small>'}</p>${panel}<div class=gb><table class=gt><tr><th>Student</th>${cats.map(c=>`<th class="sbh ac" title="${esc(c.name)} subtotal"><div>${esc(c.name)}</div><small>Subtotal · ${c.weight}%</small></th>`).join('')}<th class="sh sm">Total</th><th class="sh sm">Auto</th><th class="sh sm gend">Final</th>${as.map(a=>`<th class=ac title="${esc(a.title)}"><div>${esc(a.title)}</div><small>${esc(cn(a.category_id))}</small><small>/${a.points_possible} <button class=ed data-a=${a.id}>✎</button></small></th>`).join('')}</tr>${en.map(e=>`<tr><td><a href=# class=sl data-s=${e.student_id}>${esc(nm[e.student_id]?.full_name)}</a><br><small>${esc(nm[e.student_id]?.student_code)}</small></td>${cats.map(c=>`<td class="sbt ac" id=s-${e.student_id}-${c.id}>${pc(catPct(e.student_id,c.id))}</td>`).join('')}<td class="tot sm" id=t-${e.enrollment_id}>${pc(e.pct)}</td><td class="au sm" id=a-${e.enrollment_id}>${e.auto_result||''}</td><td class="fnl sm gend"><select class=ov id=o-${e.enrollment_id} data-e=${e.enrollment_id}>${opts.map(v=>`<option ${v===(e.final_override||'')?'selected':''}>${v}</option>`).join('')}</select></td>${as.map(a=>`<td class=ac><input class=pt data-a=${a.id} data-s=${e.student_id} value="${S[a.id+e.student_id]??''}"></td>`).join('')}</tr>`).join('')}</table></div>`;
if(keep){const g=$('.gb');g.scrollTop=keep[0];g.scrollLeft=keep[1]}
const re=u=>gradebook(cid,u);
$('#back').onclick=classList;M().querySelectorAll('.sl').forEach(a=>a.onclick=e=>{e.preventDefault();studentCard(a.dataset.s,cid)});$('#na').onclick=()=>re({p:'a'});$('#nc').onclick=()=>re({p:'c'});
$('#st').onclick=async()=>{if(!done&&!confirm('Mark this class as complete? It moves to Completed Classes, and results count toward credits.'))return;if(await ok(sb.rpc('set_class_status',{cid,s:done?'in_progress':'complete'})))done?re():classList()};
M().querySelectorAll('.ed[data-a]').forEach(b=>b.onclick=()=>re({p:'ea',id:b.dataset.a}));
M().querySelectorAll('.ec').forEach(b=>b.onclick=()=>re({p:'ec',id:b.dataset.k}));
if($('#fx'))$('#fx').onclick=()=>re();
if($('#fs'))$('#fs').onclick=async()=>{const t=$('#ft').value.trim(),p=parseFloat($('#fp').value),v={title:t,points_possible:p,category_id:$('#fc').value||null};if(!t||!(p>0))return alert('Enter a title and the points possible.');if(await ok(ea?sb.from('assignments').update(v).eq('id',ea.id):sb.from('assignments').insert({...v,class_id:cid})))re()};
if($('#fd'))$('#fd').onclick=async()=>{if(confirm('Delete this assignment and all its scores?')&&await ok(sb.from('assignments').delete().eq('id',ea.id)))re()};
if($('#cs'))$('#cs').onclick=async()=>{const n=$('#fn').value.trim(),w=parseFloat($('#fw').value),v={name:n,weight:w};if(!n||!(w>=0))return alert('Enter a name and a weight.');if(await ok(ec?sb.from('categories').update(v).eq('id',ec.id):sb.from('categories').insert({...v,class_id:cid})))re()};
if($('#cd'))$('#cd').onclick=async()=>{if(confirm('Delete this category? Its assignments will have no category.')&&await ok(sb.from('categories').delete().eq('id',ec.id)))re()};
M().querySelectorAll('.pt').forEach(i=>i.onchange=async()=>{const k={assignment_id:i.dataset.a,student_id:i.dataset.s},v=i.value.trim(),n=parseFloat(v);if(v!==''&&isNaN(n))return alert('Enter a number.');
if(!await ok(v===''?sb.from('scores').delete().match(k):sb.from('scores').upsert({...k,points:n})))return;
const sk=k.assignment_id+k.student_id;if(v==='')delete S[sk];else S[sk]=n;cats.forEach(c=>{const t=document.getElementById('s-'+k.student_id+'-'+c.id);if(t)t.textContent=pc(catPct(k.student_id,c.id))});
const{data:u}=await sb.from('enrollment_results').select('*').eq('class_id',cid);(u||[]).forEach(e=>{const t=$('#t-'+e.enrollment_id);if(t){t.textContent=pc(e.pct);$('#a-'+e.enrollment_id).textContent=e.auto_result||'';$('#o-'+e.enrollment_id).value=e.final_override||''}})});
M().querySelectorAll('.ov').forEach(s=>s.onchange=()=>ok(sb.from('enrollments').update({final_override:s.value||null}).eq('id',s.dataset.e)))}
async function gradeTools(){
M().innerHTML=`<h3>Grade Levels</h3><div class=card><p>Edit a single student's grade level on their profile. Bulk option:</p><button id=up>Move ALL students up one grade (max 12)</button></div><div class=card><p><b>Suggest promotions from credits earned</b></p><label>Credits needed for grade 11<input id=c11 type=number step=any value=6></label><label>Credits needed for grade 12<input id=c12 type=number step=any value=12></label><button id=pv>Preview</button><p><small>Counts completed, passed courses only. Only suggests moving up, and you can change each suggestion before applying.</small></p><div id=pvo></div></div>`;
$('#up').onclick=async()=>{if(!confirm('Move every student below grade 12 up one grade?'))return;const{data}=await sb.from('profiles').select('id,grade_level').eq('role','student');for(const s of data)if(s.grade_level<12)await sb.from('profiles').update({grade_level:s.grade_level+1}).eq('id',s.id);alert('Done')};
$('#pv').onclick=async()=>{const a=parseFloat($('#c11').value),b=parseFloat($('#c12').value);if(!(a>=0&&b>=0))return alert('Enter both credit amounts.');
const[{data:st},{data:rs}]=await Promise.all([sb.from('profiles').select('id,full_name,grade_level').eq('role','student').order('full_name'),sb.from('enrollment_results').select('student_id,credits,result,status')]);
const e={};rs.filter(passed).forEach(r=>e[r.student_id]=(e[r.student_id]||0)+Number(r.credits));
const ch=st.map(s=>({...s,cr:e[s.id]||0,sg:(e[s.id]||0)>=b?12:(e[s.id]||0)>=a?11:10})).filter(s=>s.sg>s.grade_level);
$('#pvo').innerHTML=ch.length?`<table>${cg([40,20,20,20])}<tr><th>Student</th><th>Credits</th><th>Current</th><th>New Grade</th></tr>${ch.map(s=>`<tr><td>${esc(s.full_name)}</td><td>${s.cr}</td><td>${s.grade_level}</td><td><select class=ng data-i=${s.id}>${[9,10,11,12].map(g=>`<option ${g===s.sg?'selected':''}>${g}</option>`).join('')}</select></td></tr>`).join('')}</table><button id=ap>Apply</button>`:'No changes suggested.';
if(ch.length)$('#ap').onclick=async()=>{for(const s of M().querySelectorAll('.ng'))await sb.from('profiles').update({grade_level:+s.value}).eq('id',s.dataset.i);alert('Applied');gradeTools()}}}
</script></body></html>
